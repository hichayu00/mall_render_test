<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>회원정보 | 작은 쇼핑몰</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
</head>
<body class="account-body">
    <main class="card" aria-labelledby="page-title">
        <p class="brand"><span class="brand-mark" aria-hidden="true">✳</span> 작은 쇼핑몰</p>
        <h1 id="page-title">회원정보</h1>
        {% if updated %}
            <p class="success" role="status">회원정보를 수정했습니다.</p>
        {% endif %}
        <p><strong>{{ user.name }}</strong>님, 로그인되었습니다.</p>
        <dl>
            <dt>회원 번호</dt>
            <dd>{{ user.id }}</dd>
            <dt>이메일</dt>
            <dd>{{ user.email }}</dd>
        </dl>
        <a class="button" href="/account/edit">회원정보 수정</a>
        <a class="button secondary" href="/orders">주문·구매내역</a>
        <form action="/logout" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <button type="submit">로그아웃</button>
        </form>
        <p class="hint"><a href="/account/withdraw">회원 탈퇴</a></p>
        <p class="hint"><a href="/products">상품 목록으로</a></p>
        <p class="hint"><a href="/cart">장바구니 보기</a></p>
    </main>
</body>
</html>
